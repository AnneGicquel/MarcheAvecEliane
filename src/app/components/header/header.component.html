<header>
  <nav>
    <!-- ANIMATED BURGER ICON -->
    <input type="checkbox" class="menuBurger" id="menuBurger" />
    <label
      for="menuBurger"
      class="animatedBurgerIcon"
      role="button"
      aria-expanded="false"
      aria-label="Toggle Burger Menu"
      tabindex="0"
    >
      <div class="spinner diagonal part-1"></div>
      <div class="spinner horizontal"></div>
      <div class="spinner diagonal part-2"></div>
    </label>

    <!-- LOGO -->
    @if (!isMNGMTPage()) {<a class="logoContainer" routerLink="/accueil">
      <img src="assets/images/logo/Marche_avec_Eliane_Logo.png" /></a
    >} 
    @else{
      <a class="logoContainer" >
        <img src="assets/images/logo/Marche_avec_Eliane_Logo.png" /></a
      >
    }

    <ul>
      <!-- ABOUT US -->
      <div class="navbarToSidebar">
        <li class="navItem">
          <span (click)="toggleAboutUs()" [ngClass]="{ hidden: isMNGMTPage() }"
            >à propos <i class="fas fa-chevron-down"></i
          ></span>
          <!-- DROPDOWN -->
          <div
            class="dropdown"
            *ngIf="isOpenAboutUs"
            (appOutSideClick)="(isOpenAboutUs)"
            (outSideClick)="isOpenAboutUs = false"
          >
            <div class="menu-item">
              <a routerLink="/a_propos/histoire">notre histoire</a>
            </div>
            <div class="menu-item">
              <a routerLink="/a_propos/charte">notre charte</a>
            </div>
          </div>
        </li>

        <!-- COMPANION SHIP SCHEDULER -->
        <li class="navItem">
          <a routerLink="/rencontres" [ngClass]="{ hidden: isMNGMTPage() }"
            >rencontres</a
          >
        </li>

        <!-- MUTUAL AID -->
        <li class="navItem">
          <span
            (click)="toggleMutualAid()"
            [ngClass]="{ hidden: isMNGMTPage() }"
            >entraide <i class="fas fa-chevron-down"></i
          ></span>
          <!-- DROPDOWN -->
          <div
            class="dropdown"
            *ngIf="isOpenMutualAid"
            (appOutSideClick)="(isOpenMutualAid)"
            (outSideClick)="isOpenMutualAid = false"
          >
            <div class="menu-item">
              <a routerLink="/entraide/communication">nos conseils</a>
            </div>
            <div class="menu-item">
              <a routerLink="/entraide/aide">notre aide</a>
            </div>
          </div>
        </li>
      </div>
      <!-- ACCOUNT SETTINGS -->
      <li class="navItem">
        <button class="profilButton" (click)="toggleAccountSettings()">
          {{ isMNGMTPage() ? "🔚" : "" }}
          {{ !isMNGMTPage() ? userInitial : "" }}
        </button>
        <!-- DROPDOWN -->
        <div
          class="dropdown"
          *ngIf="isOpenAccountSettings"
          (appOutSideClick)="(isOpenAccountSettings)"
          (outSideClick)="isOpenAccountSettings = false"
        >
          <div class="menu-item" [ngClass]="{ hidden: isMNGMTPage() }">
            <a routerLink="/mes_informations">informations</a>
          </div>
          <div class="menu-item">
            <a routerLink="/connexion" (click)="logout()"
              ><button class="signOutBtn">
                Déconnexion &nbsp;<i class="fas fa-sign-out-alt"></i>
              </button>
            </a>
          </div>
        </div>
      </li>
    </ul>
  </nav>
</header>
